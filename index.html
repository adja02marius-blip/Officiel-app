<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En savoir plus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card img {
      width: 100%;
      display: block;
      max-height: 280px;
    }

    .card-content {
      padding: 24px;
    }

    .card-content h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .card-content p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 50px;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .whatsapp-btn:hover {
      background-color: #1ebe57;
      transform: scale(1.02);
    }

    .whatsapp-btn svg {
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Remplace "image.jpg" par le chemin de ton image -->
    <img src="Image.jpeg" alt="Coupons de paris gratuits">

    <div class="card-content">
      <h1>CLIQUEZ ICI</h1>
      <p>👇👇👇👇</p>

      <!-- Remplace le lien ci-dessous par le vrai lien d'invitation WhatsApp -->
      <a href="https://whatsapp.com/channel/0029Vb5aneKDJ6H2jeNnuR02" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
        Rejoindre la chaîne WhatsApp maintenant 🔞
      </a>
      <br> <br>
      <h4>‼️⚠️ 𝐑𝐞𝐬𝐞𝐫𝐯𝐞𝐫 𝐚𝐮𝐱 𝐩𝐞𝐫𝐬𝐨𝐧𝐧𝐞𝐬 𝐦𝐚𝐣𝐞𝐮𝐫𝐬 (+18𝐚𝐧𝐬)</h4>
    </div>
  </div>

  <script>
    // Optionnel : tracker un clic (par exemple pour compter les redirections)
    document.querySelector('.whatsapp-btn').addEventListener('click', function() {
      console.log('Clic sur le bouton WhatsApp enregistré');
      // Tu peux ajouter ici un appel à un outil d'analytics si besoin
    });
  </script>

</body>
</html>
